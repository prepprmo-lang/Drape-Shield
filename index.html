<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drape Shield – Visualization</title>
<style>
:root{--bg:#f6f4ef;--fg:#1d2330;--mut:#6b7280;--card:#fff;--line:#d9d6cc;--acc:#c2410c;--A:#2b5fa8;--B:#1f9a9a;--CA:#d9772b;--CB:#e6b032;--hub:#1f9a9a;--wheel:#9aa0ab;--hw:#c9ccd4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--fg:#eceff4;--mut:#9aa3b2;--card:#1d222b;--line:#2f3642;--acc:#fb923c;--A:#4f86d6;--B:#35b8b8;--CA:#f08c3c;--CB:#f2c04a;--hub:#35b8b8;--wheel:#4b5260;--hw:#aeb3bf}}
:root[data-theme="dark"]{--bg:#14171d;--fg:#eceff4;--mut:#9aa3b2;--card:#1d222b;--line:#2f3642;--acc:#fb923c;--A:#4f86d6;--B:#35b8b8;--CA:#f08c3c;--CB:#f2c04a;--hub:#35b8b8;--wheel:#4b5260;--hw:#aeb3bf}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 2px}p.s{margin:0 0 10px;color:var(--mut);font-size:13px}
#stage{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:min(62vh,560px);cursor:grab}
.panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
label{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}label b{color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{background:var(--acc);color:#fff;border:0;border-radius:9px;padding:8px 12px;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--fg);border:1px solid var(--line)}
.k{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}.k i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
</style></head><body><main>
<h1>Drape Shield – Visualization</h1>
<p class="s">Drag to rotate. Stretch the radius: each rib's slider telescopes out and the panel stays gap-free.</p>
<div id="stage"><canvas id="cv"></canvas></div>
<div class="panel">
 <div class="c"><label>Guard radius <b id="vR"></b></label><input id="R" type="range" min="270" max="380" value="320"></div>
 <div class="c"><label>Sector angle <b id="vG"></b></label><input id="G" type="range" min="90" max="270" value="140"></div>
 <div class="c"><label>Ribs <b id="vN"></b></label><input id="N" type="range" min="7" max="13" step="1" value="9"></div>
 <div class="c"><div class="row"><button id="auto">▶ Auto-flex</button><button class="g" id="wh">Show tyre</button><button class="g" id="top">Top view</button></div>
 <div class="s" style="margin-top:8px" id="info"></div></div>
</div>
<div class="k"><span><i style="background:var(--CB)"></i>slider (cloth side)</span><span><i style="background:var(--B)"></i>rib layer B</span><span><i style="background:var(--A)"></i>rib layer A</span><span><i style="background:var(--CA)"></i>slider (wheel side)</span></div>
</main>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const RMIN=270,RMAX=380,S0=40,STUD=160,HUB=30,LAP=.25,T=3;
let CX=0,az=90,el=48,auto=false,showW=false,dir=1,W=0,H=0,dpr=1;
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function shade(hex,f){let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');const n=parseInt(c,16);
 const r=Math.min(255,(n>>16&255)*f)|0,g=Math.min(255,(n>>8&255)*f)|0,b=Math.min(255,(n&255)*f)|0;return`rgb(${r},${g},${b})`}
function size(){dpr=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr}
addEventListener('resize',size);
// wedge polygon in plate-local coords (apex at origin)
function wedge(h,s0,s1){const p=[],n=16;for(let i=0;i<=n;i++){const a=-h+2*h*i/n;p.push([s1*Math.cos(a),s1*Math.sin(a)])}
 for(let i=4;i>=0;i--){const a=-h+2*h*i/4;p.push([s0*Math.cos(a),s0*Math.sin(a)])}return p}
function circle(r,n=48){const p=[];for(let i=0;i<n;i++){const a=2*Math.PI*i/n;p.push([r*Math.cos(a),r*Math.sin(a)])}return p}
function place(poly,th,dx){const c=Math.cos(th),s=Math.sin(th);return poly.map(([x,y])=>[x*c-y*s+dx*c,x*s+y*c+dx*s])}
function proj([x,y],z,sc){const A=az*Math.PI/180,E=el*Math.PI/180;
 const x0=x-CX,xr=x0*Math.cos(A)-y*Math.sin(A),yr=x0*Math.sin(A)+y*Math.cos(A);
 return[W/2+xr*sc,H*0.52-(yr*Math.sin(E)+z*Math.cos(E))*sc]}
function plate(poly,z0,z1,col,sc,alpha=1){
 const top=poly.map(p=>proj(p,z1,sc)),bot=poly.map(p=>proj(p,z0,sc));
 const A=az*Math.PI/180,idx=poly.map((_,i)=>i).sort((a,b)=>{const d=q=>poly[q][0]*Math.sin(A)+poly[q][1]*Math.cos(A);return d(b)-d(a)});
 ctx.globalAlpha=alpha;ctx.fillStyle=shade(col,.62);ctx.strokeStyle=shade(col,.5);ctx.lineWidth=.6;
 for(const i of idx){const j=(i+1)%poly.length;ctx.beginPath();ctx.moveTo(...bot[i]);ctx.lineTo(...bot[j]);ctx.lineTo(...top[j]);ctx.lineTo(...top[i]);ctx.closePath();ctx.fill();ctx.stroke()}
 ctx.fillStyle=col;ctx.strokeStyle=shade(col,.7);ctx.beginPath();top.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill();ctx.stroke();ctx.globalAlpha=1;return top}
function draw(){
 const R=+$('R').value,G=+$('G').value,N=+$('N').value,D=R-RMIN;
 $('vR').textContent=R+' mm';$('vG').textContent=G+'°';$('vN').textContent=N;
 const pitch=G/(N+LAP),w=(1+LAP)*pitch,ws=w*RMAX/RMIN;
 const th=i=>(-G/2+w/2+i*pitch)*Math.PI/180,hb=w/2*Math.PI/180,hs=ws/2*Math.PI/180;
 const xmin=Math.min(-HUB,RMAX*Math.cos(G/2*Math.PI/180));CX=(RMAX+xmin)/2;
 const sc=Math.min(W/(2*RMAX*Math.sin(Math.min(G/2+8,90)*Math.PI/180)*1.1),H*0.86/((RMAX-xmin)*0.85));
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 const fA=css('--A'),fB=css('--B'),fCA=css('--CA'),fCB=css('--CB'),hub=css('--hub'),hw=css('--hw');
 if(showW){const ro=R-20,ri=ro-95,z=-38;
  const ring=(r,zz)=>circle(r,90).map(p=>proj(p,zz,sc));
  ctx.fillStyle=css('--wheel');ctx.globalAlpha=.55;ctx.beginPath();
  for(const r of[ro,ri]){ring(r,z).forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath()}
  ctx.fill('evenodd');ctx.globalAlpha=1}
 const layers=[[-3,0,fCA,0],[0,3,fA,0],[3,6,fB,1],[6,9,fCB,1]];
 // hub bosses first (A boss below, B boss above)
 plate(circle(HUB),-6,3,fA,sc);
 for(const [z0,z1,col,par] of layers){
  for(let i=par;i<N;i+=2){
   const slider=(col===fCA||col===fCB);
   const poly=slider?place(wedge(hs,S0,RMIN),th(i),D):place(wedge(hb,10,RMIN),th(i),0);
   const top=plate(poly,z0,z1,col,sc);
   if(slider){ // slot
    const a=th(i),c=Math.cos(a),s=Math.sin(a),s1=STUD-(RMAX-RMIN)+D,s2=STUD+D;
    ctx.strokeStyle=shade(col,.35);ctx.lineWidth=Math.max(1.5,4.8*sc);ctx.lineCap='round';ctx.beginPath();
    ctx.moveTo(...proj([s1*c,s1*s],z1,sc));ctx.lineTo(...proj([s2*c,s2*s],z1,sc));ctx.stroke()}
  }
  if(z1===3){}
 }
 plate(circle(HUB),3,12,fB,sc);
 ctx.fillStyle=css('--bg');ctx.beginPath();circle(13).map(p=>proj(p,12,sc)).forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.fill();
 // knobs
 for(let i=0;i<N;i++){const a=th(i),p=[STUD*Math.cos(a),STUD*Math.sin(a)],z=i%2?13:5.5;
  ctx.fillStyle=hw;ctx.strokeStyle=shade(hw,.6);ctx.lineWidth=.8;ctx.beginPath();circle(i%2?7:4,20).map(q=>proj([q[0]+p[0],q[1]+p[1]],z,sc)).forEach((q,k)=>k?ctx.lineTo(...q):ctx.moveTo(...q));ctx.fill();ctx.stroke()}
 $('info').innerHTML=`Slider travel <b>${D} mm</b> · tyre up to <b>${R-20} mm</b> radius (20 mm clearance)`}
let last=0;function loop(t){if(auto){const dt=Math.min(t-last,50);const r=$('R');let v=+r.value+dir*dt*.03;if(v>=RMAX){v=RMAX;dir=-1}if(v<=RMIN){v=RMIN;dir=1}r.value=v}last=t;draw();requestAnimationFrame(loop)}
let drag=null;cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY,az,el];cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{if(!drag)return;az=drag[2]+(e.clientX-drag[0])*.5;el=Math.max(8,Math.min(90,drag[3]+(e.clientY-drag[1])*.4))});
cv.addEventListener('pointerup',()=>{drag=null;cv.style.cursor='grab'});
$('auto').onclick=e=>{auto=!auto;e.target.textContent=auto?'⏸ Pause':'▶ Auto-flex'};
$('wh').onclick=e=>{showW=!showW;e.target.textContent=showW?'Hide tyre':'Show tyre'};
$('top').onclick=()=>{az=90;el=90};
size();requestAnimationFrame(loop);
</script></body></html>
